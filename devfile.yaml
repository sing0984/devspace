schemaVersion: 2.2.0
metadata:
  name: my-workspace
attributes:
  container-overides:
    securityContext:
      capabilities:
        add:
          # See SecurityContextConstraints for details on required capabilities
          - SETGID
          - SETUID
          - SYS_ADMIN
          - SYS_CHROOT
  pod-overrides:
    spec:
      serviceAccountName: adp3g-build
    metadata:
      annotations:
        # /dev/fuse allows efficient filesystems for rootless containers (fuse-overlayfs)
        # /dev/net/run allows efficient networking for rootless containers (passt/pasta)
        io.kubernetes.cri-o.Devices: '/dev/fuse,/dev/net/tun'
        openshift.io/required-scc: adp3g-build
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/vinay-devspaces/adp3g-build:2.0.0
      command: ["/bin/sh", "-c", "sleep infinity"]





