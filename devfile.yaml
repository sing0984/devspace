schemaVersion: 2.2.0
metadata:
  name: my-workspace
attributes:
  container-overides:
    securityContext:
      runAsUser: 1000 #adp3g-build user as 1000
      # runAsNonRoot: true
  #     capabilities:
  #       add:
  #         - SETGID
  #         - SETUID
  pod-overrides:
    spec:
      serviceAccountName: adp3g-build
      # hostUsers: false  #for podman hostname is false 
    # metadata:
    #   annotations:
    #     # /dev/fuse allows efficient filesystems for rootless containers (fuse-overlayfs)
    #     # /dev/net/run allows efficient networking for rootless containers (passt/pasta)
    #     io.kubernetes.cri-o.Devices: '/dev/fuse,/dev/net/tun'
    #     openshift.io/required-scc: nested-container
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/vinay-devspaces/adp3g-build:latest
      command:
        - sleep
      args:
        - infinity
      env:
        - name: JAVA_HOME
          value: "/opt/jdk-17.0.15"
        - name: MAVEN_HOME
          value: "/opt/maven-3.9.11"
        - name: NODE_HOME
          value: "/opt/node-24.15.0"
        - name: OC_HOME
          value: "/opt/oc-4.20.0-202608260744"

      # command:   # from cmd and below, config for podman 
      #   - /usr/bin/podman 
